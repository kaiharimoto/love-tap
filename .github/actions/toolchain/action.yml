name: the toolchain
description: >
  Flutter, Java and the Python packages the asset packer needs, pinned the way bootstrap.sh pins
  them. Not bootstrap.sh itself: that also fetches Blender, Tailscale, Playwright and an Android
  system image, which are for rendering and capture and have no business in a build.

inputs:
  flutter-version:
    description: Must match FLUTTER_VERSION in bootstrap.sh.
    required: false
    default: '3.47.2'

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # What tools/pack_assets.py and tools/bake_tear_shadows.py import. Not fonttools or
    # skia-pathops: the three hands are committed as built TTFs and nothing here rebuilds them.
    - name: the python packages the packer needs
      shell: bash
      run: python3 -m pip install --quiet --disable-pip-version-check numpy pillow opencv-python-headless

    - name: cache flutter
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/toolchain/flutter
        key: flutter-${{ inputs.flutter-version }}-${{ runner.os }}-v1

    - name: flutter ${{ inputs.flutter-version }}
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p toolchain
        url="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${{ inputs.flutter-version }}-stable.tar.xz"
        # Straight from Google, the same URL and the same pin bootstrap.sh uses, rather than through
        # a third-party action: this is the one step that decides what compiles the app.
        for attempt in 1 2 3 4; do
          curl -fSL --retry 3 --retry-delay 5 -o /tmp/flutter.tar.xz "$url" && break
          sleep $((attempt * 5))
        done
        tar -xJf /tmp/flutter.tar.xz -C toolchain
        rm -f /tmp/flutter.tar.xz

    - name: put it on the path and warm it
      shell: bash
      run: |
        set -euo pipefail
        echo "${{ github.workspace }}/toolchain/flutter/bin" >> "$GITHUB_PATH"
        echo "FLUTTER_ROOT=${{ github.workspace }}/toolchain/flutter" >> "$GITHUB_ENV"
        git config --global --add safe.directory "${{ github.workspace }}/toolchain/flutter"
        "${{ github.workspace }}/toolchain/flutter/bin/flutter" --version
